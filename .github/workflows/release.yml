name: Build and release APK

# Runs on every push to main (and when you press "Run workflow" manually).
# 1. Builds a signed release APK with YOUR permanent keystore
# 2. Publishes it as a GitHub Release
# 3. Publishes ota.json to GitHub Pages (what the app reads to find updates)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: pterodroid-release
  cancel-in-progress: false

env:
  APP_ID: com.skycord.pterodroid
  # versionCode = this number + the workflow run number. Always increases.
  VERSION_CODE_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # AI Studio overwrites app/google-services.json every time you upload a zip
      # (and different AI Studio accounts produce different files). The build always
      # uses your own pinned copy from ci/google-services.json instead.
      - name: Use pinned Firebase config
        run: |
          set -euo pipefail
          [ -f ci/google-services.json ] || { echo "::error::ci/google-services.json is missing. Add your Firebase google-services.json at that path."; exit 1; }
          python3 - <<'PY'
          import json, sys
          d = json.load(open("ci/google-services.json"))
          ok = d["project_info"]["project_id"] == "pterodroid-app" and any(
              c["client_info"]["android_client_info"]["package_name"] == "com.skycord.pterodroid"
              for c in d["client"])
          if not ok:
              print("::error::ci/google-services.json is not for project pterodroid-app / package com.skycord.pterodroid")
              sys.exit(1)
          PY
          cp ci/google-services.json app/google-services.json
          echo "Pinned google-services.json in place"

      - name: Check that the signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64 and/or KEYSTORE_PASSWORD. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore and check it
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias upload > /dev/null 2>&1; then
            echo "::error::Keystore could not be opened with alias 'upload'. Wrong KEYSTORE_PASSWORD, wrong alias, or the base64 secret is damaged."
            exit 1
          fi
          KEY_SHA256=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias upload 2>/dev/null | grep -m1 'SHA256:' | awk '{print $NF}')
          [ -n "$KEY_SHA256" ] || { echo "::error::Could not read the keystore fingerprint"; exit 1; }
          echo "KEY_SHA256=${KEY_SHA256}" >> "$GITHUB_ENV"
          echo "Keystore OK (alias: upload)"

      # FIX: the default package list includes the removed 'tools' package,
      # which made sdkmanager fail. Install nothing extra; the runner already
      # has the SDK, and the action still accepts the licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Set version
        run: |
          set -euo pipefail
          CODE=$((VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER))
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${CODE}/; s/versionName = \"[^\"]*\"/versionName = \"${NAME}\"/" app/build.gradle.kts
          # Fail loudly if the lines were not rewritten (e.g. the file layout changed)
          grep -Eq "^[[:space:]]*versionCode = ${CODE}[[:space:]]*$" app/build.gradle.kts \
            || { echo "::error::Could not set versionCode in app/build.gradle.kts"; exit 1; }
          grep -Eq "^[[:space:]]*versionName = \"${NAME}\"[[:space:]]*$" app/build.gradle.kts \
            || { echo "::error::Could not set versionName in app/build.gradle.kts"; exit 1; }
          echo "VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "Building versionCode=${CODE} versionName=${NAME}"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify the APK (package, version, signature)
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          [ -n "$SRC" ] || { echo "::error::Gradle did not produce an APK"; exit 1; }
          mkdir -p dist
          APK="dist/Pterodroid-${VERSION_NAME}.apk"
          cp "$SRC" "$APK"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)
          AAPT2=$(ls -d "$SDK"/build-tools/*/aapt2 | sort -V | tail -n 1)

          BADGING=$("$AAPT2" dump badging "$APK" | head -n 1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='${APP_ID}'" || { echo "::error::Wrong package name in APK"; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'" || { echo "::error::Wrong versionCode in APK"; exit 1; }

          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          SHA1=$(grep -m1 'certificate SHA-1 digest' certs.txt | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          SHA256=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          [ -n "$SHA1" ] && [ -n "$SHA256" ] || { echo "::error::Could not read signing certificate"; exit 1; }
          # The APK must be signed by YOUR keystore, even if AI Studio changed the signing code.
          if [ "$SHA256" != "$KEY_SHA256" ]; then
            echo "::error::APK is NOT signed with your permanent key (APK: ${SHA256} / keystore: ${KEY_SHA256}). AI Studio probably changed the signingConfigs in app/build.gradle.kts."
            exit 1
          fi

          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"
          {
            echo "### Signing certificate of this APK (register in Firebase)"
            echo ""
            echo "- SHA-1: \`${SHA1}\`"
            echo "- SHA-256: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Pterodroid ${{ env.VERSION_NAME }}
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          make_latest: true

      - name: Write ota.json
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MIN_CODE: ${{ vars.MIN_SUPPORTED_VERSION_CODE }}
        run: |
          set -euo pipefail
          MIN="${MIN_CODE:-0}"
          case "$MIN" in
            ''|*[!0-9]*) echo "::error::MIN_SUPPORTED_VERSION_CODE must be a whole number"; exit 1 ;;
          esac
          NOTES=$(printf '%s' "${COMMIT_MSG:-Update}" | head -n 1)
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/$(basename "$APK_PATH")"
          mkdir -p site
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$URL" \
            --arg sha256 "$SHA" \
            --argjson minSupportedVersionCode "$MIN" \
            --arg releaseNotes "$NOTES" \
            '{versionCode:$versionCode, versionName:$versionName, apkUrl:$apkUrl, sha256:$sha256, minSupportedVersionCode:$minSupportedVersionCode, releaseNotes:$releaseNotes}' \
            > site/ota.json
          cat site/ota.json
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          {
            echo ""
            echo "### Manifest URL for the app"
            echo ""
            echo "\`https://${OWNER}.github.io/${REPO}/ota.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4